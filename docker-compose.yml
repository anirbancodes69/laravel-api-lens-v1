services:
  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: api-lens-dev
    volumes:
      - ./package:/workspace/package
      - ./test-app:/workspace/test-app

    working_dir: /workspace
    ports:
      - "8000:8000"
    tty: true
    
  mysql:
    image: mysql:8.0
    container_name: api-lens-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: api_lens_db
      MYSQL_USER: api_lens_user
      MYSQL_PASSWORD: api_lens_pwd
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: